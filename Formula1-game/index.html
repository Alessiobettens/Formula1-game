<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Formula 1 game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Formula 1 GAME</h1>
    <button onclick="init()">Start</button>

    <div id="countdown"></div>
    <div id="time"></div>
    <div id="score">Your score: 0</div>

    <div class="video-container">
      <img id="driver-img" width="200" />
      <div id="webcam-container"></div>
    </div>

    <div id="game-over" style="display: none">
      <h2>Game Over</h2>
      <button onclick="showEndScore()">Show end score</button>
      <button onclick="resetGame()">Play Again</button>
    </div>

    <div id="final-score" style="display: none"></div>

    <div id="current-team">Current team: Ferrari</div>
    <div id="detected-team">Detected: geen team</div>
    <p>
      Show the correct team logo to the camera as quickly as possible<br />and
      score points. The faster and more accurate you are,<br />the higher your
      score!
    </p>

    <div id="label-container"></div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <!-- Jouw JS -->
    <script src="game.js"></script>
    <script src="model.js"></script>
  </body>
</html>
